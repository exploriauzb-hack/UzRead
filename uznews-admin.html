<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UzRead Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root { --ink:#0f0e0d; --paper:#f5f0e8; --accent:#c8392b; --accent2:#2b6cb0; --muted:#7a7060; --line:#d4ccc0; --green:#2d7d46; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#1a1a1a; color:#eee; font-family:'DM Sans',sans-serif; min-height:100vh; }

  header { background:#111; border-bottom:1px solid #333; padding:1rem 2rem; display:flex; align-items:center; justify-content:space-between; }
  header h1 { font-family:'Playfair Display',serif; font-size:1.4rem; color:white; }
  header h1 span { color:#c8392b; }
  .admin-badge { background:#c8392b; color:white; font-size:10px; padding:3px 10px; letter-spacing:0.15em; text-transform:uppercase; }
  .logout-btn { background:transparent; border:1px solid #444; color:#aaa; padding:6px 14px; cursor:pointer; font-size:12px; }
  .logout-btn:hover { border-color:#888; color:white; }

  /* LOGIN */
  #admin-login { max-width:380px; margin:4rem auto; background:#222; border:1px solid #333; padding:2rem; }
  #admin-login h2 { font-size:1.2rem; margin-bottom:1.5rem; color:white; }
  .form-group { margin-bottom:1rem; }
  .form-group label { display:block; font-size:11px; color:#888; letter-spacing:0.1em; text-transform:uppercase; margin-bottom:6px; }
  .form-group input { width:100%; padding:10px; background:#333; border:1px solid #444; color:white; font-family:'DM Sans',sans-serif; font-size:14px; outline:none; }
  .form-group input:focus { border-color:#888; }
  .err { font-size:12px; color:#c8392b; margin-bottom:1rem; min-height:16px; }
  .btn { background:#c8392b; color:white; border:none; padding:12px 24px; font-family:'DM Sans',sans-serif; font-size:13px; font-weight:500; cursor:pointer; width:100%; letter-spacing:0.1em; text-transform:uppercase; }
  .btn:hover { background:#a02d22; }
  .btn-green { background:#2d7d46; }
  .btn-green:hover { background:#236038; }
  .btn-outline { background:transparent; border:1px solid #555; color:#ccc; width:auto; padding:8px 18px; }
  .btn-outline:hover { border-color:#888; color:white; }

  /* DASHBOARD */
  #dashboard { display:none; padding:2rem; max-width:1100px; margin:0 auto; }

  .tabs { display:flex; gap:0; border-bottom:1px solid #333; margin-bottom:2rem; }
  .tab { padding:10px 20px; cursor:pointer; font-size:13px; color:#888; letter-spacing:0.08em; border-bottom:2px solid transparent; margin-bottom:-1px; }
  .tab.active { color:white; border-bottom-color:#c8392b; }

  /* STATS */
  .stats-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:12px; margin-bottom:2rem; }
  .stat-card { background:#222; border:1px solid #333; padding:1.25rem; }
  .stat-num { font-family:'Playfair Display',serif; font-size:2.2rem; font-weight:700; color:white; }
  .stat-label { font-size:11px; color:#888; letter-spacing:0.1em; text-transform:uppercase; margin-top:4px; }

  /* TABLE */
  .section-title { font-size:11px; letter-spacing:0.2em; text-transform:uppercase; color:#888; margin-bottom:1rem; }
  table { width:100%; border-collapse:collapse; background:#222; }
  th { font-size:10px; letter-spacing:0.15em; text-transform:uppercase; color:#888; padding:10px 14px; text-align:left; border-bottom:1px solid #333; }
  td { padding:10px 14px; font-size:13px; color:#ccc; border-bottom:1px solid #2a2a2a; }
  tr:hover td { background:#2a2a2a; }
  .badge-score { display:inline-block; padding:2px 8px; font-size:11px; font-weight:500; }
  .s-good { background:#1a3d2b; color:#4ade80; }
  .s-mid { background:#2d2a1a; color:#facc15; }
  .s-low { background:#3d1a1a; color:#f87171; }

  /* NOTIFICATION */
  #notif-panel { display:none; }
  .notif-form { background:#222; border:1px solid #333; padding:1.5rem; margin-bottom:1.5rem; }
  .notif-form h3 { font-size:13px; letter-spacing:0.1em; text-transform:uppercase; color:#888; margin-bottom:1rem; }
  .notif-form textarea { width:100%; padding:10px; background:#333; border:1px solid #444; color:white; font-family:'DM Sans',sans-serif; font-size:14px; resize:vertical; min-height:80px; outline:none; }
  .notif-form textarea:focus { border-color:#888; }
  .notif-actions { display:flex; gap:10px; margin-top:10px; }

  .notif-list { background:#222; border:1px solid #333; }
  .notif-item { padding:14px; border-bottom:1px solid #2a2a2a; display:flex; align-items:center; justify-content:space-between; gap:1rem; }
  .notif-item:last-child { border-bottom:none; }
  .notif-text { font-size:14px; color:#ccc; flex:1; }
  .notif-date { font-size:11px; color:#666; }
  .notif-active { font-size:10px; padding:3px 8px; background:#1a3d2b; color:#4ade80; letter-spacing:0.1em; text-transform:uppercase; }
  .notif-inactive { font-size:10px; padding:3px 8px; background:#2a2a2a; color:#666; letter-spacing:0.1em; text-transform:uppercase; }
  .del-btn { background:transparent; border:none; color:#666; cursor:pointer; font-size:16px; padding:4px; }
  .del-btn:hover { color:#c8392b; }

  .empty-state { text-align:center; padding:3rem; color:#666; font-size:14px; }
  .loading-text { color:#888; font-size:13px; text-align:center; padding:2rem; }
</style>
</head>
<body>

<header>
  <h1>Uz<span>Read</span></h1>
  <div style="display:flex;align-items:center;gap:12px">
    <span class="admin-badge">Admin Panel</span>
    <button class="logout-btn" onclick="doLogout()" id="logout-btn" style="display:none">Sign Out</button>
  </div>
</header>

<!-- LOGIN -->
<div id="admin-login">
  <h2>Admin Access</h2>
  <div class="form-group">
    <label>Email</label>
    <input type="email" id="a-email" placeholder="admin@email.com">
  </div>
  <div class="form-group">
    <label>Password</label>
    <input type="password" id="a-pass" placeholder="••••••••" onkeydown="if(event.key==='Enter')adminLogin()">
  </div>
  <div class="err" id="a-err"></div>
  <button class="btn" onclick="adminLogin()">Enter Admin Panel</button>
</div>

<!-- DASHBOARD -->
<div id="dashboard">
  <div class="tabs">
    <div class="tab active" onclick="showTab('stats')">📊 Statistics</div>
    <div class="tab" onclick="showTab('users')">👥 Users</div>
    <div class="tab" onclick="showTab('notif')">📢 Notifications</div>
  </div>

  <!-- STATS TAB -->
  <div id="tab-stats">
    <div class="stats-grid" id="stats-grid">
      <div class="stat-card"><div class="stat-num" id="s-users">—</div><div class="stat-label">Total Users</div></div>
      <div class="stat-card"><div class="stat-num" id="s-results">—</div><div class="stat-label">Quizzes Taken</div></div>
      <div class="stat-card"><div class="stat-num" id="s-avg">—</div><div class="stat-label">Avg Score</div></div>
      <div class="stat-card"><div class="stat-num" id="s-perfect">—</div><div class="stat-label">Perfect Scores</div></div>
    </div>
    <div class="section-title">Recent Quiz Results</div>
    <table id="results-table">
      <thead><tr><th>User</th><th>Score</th><th>Streak</th><th>Date</th></tr></thead>
      <tbody id="results-body"><tr><td colspan="4" class="loading-text">Loading...</td></tr></tbody>
    </table>
  </div>

  <!-- USERS TAB -->
  <div id="tab-users" style="display:none">
    <div class="section-title">Registered Users</div>
    <table>
      <thead><tr><th>#</th><th>Email</th><th>Streak</th><th>Joined</th></tr></thead>
      <tbody id="users-body"><tr><td colspan="4" class="loading-text">Loading...</td></tr></tbody>
    </table>
  </div>

  <!-- NOTIFICATIONS TAB -->
  <div id="tab-notif" style="display:none" id="notif-panel">
    <div class="notif-form">
      <h3>Send Notification to All Users</h3>
      <textarea id="notif-text" placeholder="e.g. New article added! Come practice today 🎉"></textarea>
      <div class="notif-actions">
        <button class="btn btn-green" style="width:auto;padding:10px 24px" onclick="sendNotif()">📢 Send Notification</button>
      </div>
    </div>
    <div class="section-title">Sent Notifications</div>
    <div class="notif-list" id="notif-list"><div class="loading-text">Loading...</div></div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://oxpbltvnbjzxqwsxrpvg.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im94cGJsdHZuYmp6eHF3c3hycHZnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyNDIxNzAsImV4cCI6MjA5NTgxODE3MH0.a_-0iKSBa8l2mr4bte6ay3g5tcgSukFA4i72YX6naQQ';
const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_ANON);

let adminUser = null;

async function adminLogin() {
  const email = document.getElementById('a-email').value.trim();
  const pass = document.getElementById('a-pass').value;
  const err = document.getElementById('a-err');
  err.textContent = '';

  const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
  if (error) { err.textContent = error.message; return; }

  adminUser = data.user;
  document.getElementById('admin-login').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
  document.getElementById('logout-btn').style.display = 'block';
  loadStats();
}

async function doLogout() {
  await sb.auth.signOut();
  location.reload();
}

function showTab(name) {
  ['stats','users','notif'].forEach(t => {
    document.getElementById('tab-'+t).style.display = t===name ? 'block' : 'none';
  });
  document.querySelectorAll('.tab').forEach((t,i) => {
    t.classList.toggle('active', ['stats','users','notif'][i] === name);
  });
  if (name === 'users') loadUsers();
  if (name === 'notif') loadNotifs();
}

async function loadStats() {
  // Results
  const { data: results } = await sb.from('uzread_results').select('*').order('created_at', { ascending: false }).limit(50);
  if (results) {
    const total = results.length;
    const avg = total ? (results.reduce((s,r) => s + r.score, 0) / total).toFixed(1) : 0;
    const perfect = results.filter(r => r.score === r.total).length;
    document.getElementById('s-results').textContent = total;
    document.getElementById('s-avg').textContent = avg + '/5';
    document.getElementById('s-perfect').textContent = perfect;

    const tbody = document.getElementById('results-body');
    tbody.innerHTML = results.slice(0, 30).map(r => {
      const scoreClass = r.score >= 4 ? 's-good' : r.score >= 2 ? 's-mid' : 's-low';
      const date = new Date(r.created_at).toLocaleDateString('en-GB');
      const uid = (r.user_id || '').substring(0, 8) + '...';
      return `<tr>
        <td style="color:#888;font-size:12px">${uid}</td>
        <td><span class="badge-score ${scoreClass}">${r.score}/${r.total}</span></td>
        <td>🔥 ${r.streak || 1}</td>
        <td style="color:#888;font-size:12px">${date}</td>
      </tr>`;
    }).join('');
  }

  // Users
  const { data: streaks } = await sb.from('uzread_streaks').select('*');
  if (streaks) {
    document.getElementById('s-users').textContent = streaks.length;
  }
}

async function loadUsers() {
  const { data: streaks } = await sb.from('uzread_streaks').select('*').order('streak', { ascending: false });
  const tbody = document.getElementById('users-body');
  if (!streaks || streaks.length === 0) {
    tbody.innerHTML = '<tr><td colspan="4" class="empty-state">No users yet</td></tr>';
    return;
  }
  tbody.innerHTML = streaks.map((u, i) => {
    const uid = (u.user_id || '').substring(0, 16) + '...';
    return `<tr>
      <td style="color:#666">${i+1}</td>
      <td style="font-size:12px;color:#888">${uid}</td>
      <td>🔥 <strong style="color:white">${u.streak}</strong></td>
      <td style="color:#666;font-size:12px">${u.last_date || '—'}</td>
    </tr>`;
  }).join('');
}

async function loadNotifs() {
  const { data } = await sb.from('uzread_notifications').select('*').order('created_at', { ascending: false });
  const list = document.getElementById('notif-list');
  if (!data || data.length === 0) {
    list.innerHTML = '<div class="empty-state">No notifications sent yet</div>';
    return;
  }
  list.innerHTML = data.map(n => `
    <div class="notif-item">
      <div>
        <div class="notif-text">${n.message}</div>
        <div class="notif-date">${new Date(n.created_at).toLocaleString('en-GB')}</div>
      </div>
      <span class="${n.active ? 'notif-active' : 'notif-inactive'}">${n.active ? 'ACTIVE' : 'OFF'}</span>
      <button class="del-btn" onclick="toggleNotif('${n.id}', ${n.active})" title="${n.active ? 'Deactivate' : 'Activate'}">${n.active ? '⏸' : '▶'}</button>
      <button class="del-btn" onclick="deleteNotif('${n.id}')" title="Delete">🗑</button>
    </div>
  `).join('');
}

async function sendNotif() {
  const msg = document.getElementById('notif-text').value.trim();
  if (!msg) return;
  // Deactivate old ones first
  await sb.from('uzread_notifications').update({ active: false }).eq('active', true);
  // Add new
  const { error } = await sb.from('uzread_notifications').insert({ message: msg, active: true });
  if (!error) {
    document.getElementById('notif-text').value = '';
    loadNotifs();
    alert('✅ Notification sent!');
  } else {
    alert('Error: ' + error.message);
  }
}

async function toggleNotif(id, current) {
  await sb.from('uzread_notifications').update({ active: !current }).eq('id', id);
  loadNotifs();
}

async function deleteNotif(id) {
  if (!confirm('Delete this notification?')) return;
  await sb.from('uzread_notifications').delete().eq('id', id);
  loadNotifs();
}

// Auto-login check
sb.auth.getSession().then(({ data }) => {
  if (data.session) {
    adminUser = data.session.user;
    document.getElementById('admin-login').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    document.getElementById('logout-btn').style.display = 'block';
    loadStats();
  }
});
</script>
</body>
</html>
